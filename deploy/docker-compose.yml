# Public demo behind an existing Caddy (see deploy/README.md).
# No port is published: Caddy reaches the container over its Docker network.

# Own project name, so it never mixes with other stacks whose compose file also sits in deploy/.
name: ai-chat-assistant

services:
  ai-demo:
    build:
      context: ..
    env_file: ../.env
    restart: unless-stopped
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    # The Docker network of the Caddy container (`docker network ls`), set in .env.
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env to the Caddy container's network}
